<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прогон — son-of-orchestrator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#0E0E10; --surface:#111114; --interactive:#1A1A1E; --hairline:#2A2A2E;
  --platinum:#D8D8DD; --white:#FFFFFF; --gray:#9A9A9A; --dim:#6E6E6E;
  --crimson:#C8102E; --orange:#F5821E;
  --e:cubic-bezier(.16,1,.3,1);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--abyss); color:var(--white);
  font:400 15px/1.55 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:clamp(16px,3vw,40px);
}
.frame{
  max-width:1240px; margin:0 auto; background:var(--surface);
  border:1px solid var(--hairline); border-radius:18px;
  padding:clamp(20px,3vw,38px);
  box-shadow:0 18px 48px -24px rgba(0,0,0,.9);
}
.head{display:grid; grid-template-columns:1fr auto; gap:clamp(16px,3vw,32px); align-items:start}
.head-t{min-width:0}
/* Лого сгенерировано на чёрном фоне. Наложением screen чёрное совпадает с
   подложкой и исчезает — снимать фон в редакторе не нужно. */
.mark{width:clamp(86px,10vw,124px); height:auto; mix-blend-mode:screen; opacity:.94; align-self:center}
h1{font-size:clamp(20px,2.4vw,27px); line-height:1.15; letter-spacing:-.022em; margin:0 0 6px; font-weight:600}
.brief{color:var(--gray); margin:0; max-width:70ch}
.num{font-variant-numeric:tabular-nums}

/* ── дорожка фаз: единственное место оранжевого ── */
.track{margin:clamp(26px,3vw,38px) 0 0; display:grid; gap:10px}
.track ol{list-style:none; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:6px; margin:0; padding:0}
.track li{display:grid; gap:8px; min-width:0}
.bar{height:3px; border-radius:2px; background:var(--hairline); transform-origin:left; }
.track li[data-s="done"] .bar{background:var(--platinum)}
.track li[data-s="now"]  .bar{background:var(--orange)}
.track span{font-size:12px; color:var(--gray); letter-spacing:.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.track li[data-s="now"] span{color:var(--orange); font-weight:600}
.track li[data-s="done"] span{color:var(--platinum)}

/* ── разрыв: герой страницы ──
   Две дорожки на общей шкале 0–100 с отметкой цели: разрыв читается как
   расстояние между концами, а не как разность двух чисел в голове. Один
   маркер на дорожку — сходящиеся значения больше не наезжают подписями. */
.gap{margin-top:clamp(30px,4vw,48px); background:var(--interactive); border:1px solid var(--hairline); border-radius:14px; padding:clamp(20px,2.6vw,32px)}
.gap h2{font-size:13px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--gray); margin:0 0 22px}
.lanes{position:relative; display:grid; gap:14px; padding-top:24px}
.lane{display:grid; grid-template-columns:minmax(96px,auto) 1fr minmax(64px,auto); gap:16px; align-items:center}
.lane>i{font-style:normal; font-size:13px; color:var(--gray); letter-spacing:.02em}
.rail{position:relative; height:26px; background:var(--abyss); border:1px solid var(--hairline); border-radius:6px; overflow:hidden}
/* Заполнение режется клипом, а не меняет ширину: анимация ширины двигает
   раскладку, клип композитится и не трогает геометрию. */
.fill{position:absolute; inset:1px; border-radius:5px; clip-path:inset(0 var(--rest,100%) 0 0);
  transition:clip-path .7s var(--e)}
.lane[data-k="done"] .fill{background:var(--platinum)}
.lane[data-k="hit"] .fill{background:var(--white)}
.lane[data-k="hit"][data-void="1"] .fill{background:repeating-linear-gradient(135deg,var(--hairline) 0 7px,transparent 7px 14px)}
.lane>b{font:700 clamp(19px,2vw,25px)/1 "Golos Text",system-ui,sans-serif; letter-spacing:-.03em; text-align:right; font-variant-numeric:tabular-nums}
.lane[data-k="done"]>b{color:var(--platinum)}
.lane[data-k="hit"]>b{color:var(--white)}
.lane[data-k="hit"][data-void="1"]>b{color:var(--gray)}
/* Разрыв живёт ВНУТРИ каждой дорожки, а не полосой поверх блока: так он
   физически не может задеть подпись или число ни на какой ширине. */
.gapzone{position:absolute; top:0; bottom:0; pointer-events:none; background:rgba(200,16,46,.17);
  border-left:1px dashed var(--crimson); border-right:1px dashed var(--crimson)}
.bridge-t{position:absolute; top:0; transform:translateX(-50%); font-size:12px; font-weight:500;
  color:var(--crimson); white-space:nowrap; letter-spacing:.02em; pointer-events:none}
.basis{font-size:12px; color:var(--gray); letter-spacing:.02em; grid-column:2 / -1; margin-top:-6px}
.gapnote{margin:22px 0 0; color:var(--gray); max-width:78ch}
.gapnote b{color:var(--crimson); font-weight:600}

/* ── две колонки ── */
.cols{display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(16px,2vw,26px); margin-top:clamp(24px,3vw,34px); align-items:start}
section.panel{background:var(--interactive); border:1px solid var(--hairline); border-radius:14px; padding:clamp(18px,2.2vw,26px); min-width:0}
.panel h2{font-size:13px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--gray); margin:0 0 4px}
.panel .sub{font-size:13px; color:var(--gray); margin:0 0 18px}
ul.rows{list-style:none; margin:0; padding:0}
ul.rows>li{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:baseline; padding:13px 0; border-top:1px solid var(--hairline)}
ul.rows>li:first-child{border-top:0}
.id{font:500 12px/1.4 var(--mono); color:var(--gray); letter-spacing:.04em}
.ttl{min-width:0}
.ttl>b{font-weight:500; color:var(--white); display:block}
.ttl>small{display:block; color:var(--gray); font-size:13px; margin-top:5px}
.pips{display:flex; gap:4px; margin-top:9px}
.pip{width:16px; height:4px; border-radius:2px; background:var(--hairline)}
.pip[data-p="pass"]{background:var(--platinum)}
.pip[data-p="fail"]{background:var(--crimson)}
.chip{font-size:12px; letter-spacing:.03em; color:var(--gray); white-space:nowrap; display:inline-flex; align-items:center; gap:7px}
.chip::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--hairline); flex:none}
.chip[data-s="done"]::before,.chip[data-s="confirmed"]::before{background:var(--platinum)}
.chip[data-s="doing"]::before{background:var(--platinum); animation:beat 1.7s var(--e) infinite}
.chip[data-s="failed"]::before,.chip[data-s="missing"]::before{background:var(--crimson)}
.chip[data-s="partial"]::before{background:linear-gradient(90deg,var(--platinum) 50%,var(--crimson) 50%)}
.chip[data-s="out-of-scope"]::before{background:transparent; border:1px solid var(--dim)}
.chip[data-s="done"],.chip[data-s="confirmed"]{color:var(--platinum)}
.chip[data-s="failed"],.chip[data-s="missing"]{color:var(--crimson)}
li[data-s="out-of-scope"] .ttl>b{color:var(--gray)}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.32}}
blockquote{margin:0; font-style:normal}
blockquote>b{font-weight:500; color:var(--white); display:block}
.trace{font:500 11px/1.5 var(--mono); color:var(--gray); margin-top:6px; letter-spacing:.03em}
footer{margin-top:clamp(22px,3vw,32px); padding-top:18px; border-top:1px solid var(--hairline); display:flex; flex-wrap:wrap; gap:8px 20px; color:var(--gray); font-size:13px}
.live{display:inline-flex; align-items:center; gap:8px}
.live::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--platinum); animation:beat 1.7s var(--e) infinite}
.live[data-live="0"]::before{background:var(--dim); animation:none}
.empty{color:var(--gray); margin:0; padding:16px 0}
@media (max-width:560px){
  .mark{width:76px}
  /* Узкий экран: подпись и число в строку, шкала под ними во всю ширину —
     иначе от дорожки остаётся огрызок, на котором разрыв не прочитать. */
  .lane{grid-template-columns:1fr auto; gap:9px 12px}
  .lane>i{order:1}
  .lane>b{order:2; font-size:21px}
  .lane .rail{order:3; grid-column:1 / -1}
  .lanes{gap:20px}
  .basis{grid-column:1 / -1; margin-top:0}
}
@media (max-width:900px){
  .cols{grid-template-columns:1fr}
  .track ol{grid-auto-flow:row; grid-auto-columns:auto}
  .track li{grid-template-columns:44px 1fr; align-items:center; gap:12px}
  .scale{height:112px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<!--
THESIS: Экран показывает не сколько сделано, а насколько сделанное совпало с тем, что человек просил; отказ от плитки «большое число плюс подпись», которой эта категория всегда закрывает метрики.
OWN-WORLD: Палитра Culture of Ai — бездна #0E0E10, поверхность #111114, карточка #1A1A1E, линейка #2A2A2E; платина #D8D8DD несёт сделанное, багровый #C8102E — провалы и разрыв, оранжевый #F5821E принадлежит только дорожке фаз, потому что дирижёр здесь один. Golos Text, цифры табличные, состояния кодируются формой и светлотой, а не палитрой из семи оттенков.
STORY: Человек открывает вкладку между тикетами, за секунду видит фазу и разрыв между выполнением и попаданием, а ниже находит поимённо, что просил и что из этого не сбылось.
FIRST VIEWPORT: Название прогона и бриф, под ними дорожка из семи фаз с оранжевым текущим шагом, дальше во всю ширину общая шкала с двумя маркерами и багровым отрезком разрыва между ними.
FORM: Пинован заказчиком — палитра Culture of Ai и два референса дашбордов, жеребьёвка направлений не проводилась.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

  <nav class="track" aria-label="Фазы прогона"><ol id="phases"></ol></nav>

  <section class="gap" aria-labelledby="gap-h">
    <h2 id="gap-h">Выполнение и попадание</h2>
    <div class="lanes" id="lanes">
      <div class="lane" data-k="done">
        <i>Выполнение</i>
        <div class="rail"><span class="fill" id="f-done"></span><span class="gapzone" hidden></span></div>
        <b class="num" id="v-done">—</b>
      </div>
      <div class="lane" data-k="hit" id="lane-hit">
        <i>Попадание</i>
        <div class="rail"><span class="fill" id="f-hit"></span><span class="gapzone" hidden></span></div>
        <b class="num" id="v-hit">—</b>
      </div>
      <p class="basis" id="basis"></p>
      <span class="bridge-t" id="bridge-t" hidden></span>
    </div>
    <p class="gapnote" id="gapnote"></p>
  </section>

  <div class="cols">
    <section class="panel" aria-labelledby="t-h">
      <h2 id="t-h">Тикеты</h2>
      <p class="sub" id="t-sub"></p>
      <ul class="rows" id="tickets"></ul>
    </section>
    <section class="panel" aria-labelledby="r-h">
      <h2 id="r-h">Что просили</h2>
      <p class="sub" id="r-sub"></p>
      <ul class="rows" id="reqs"></ul>
    </section>
  </div>

  <footer>
    <span class="live" id="live" data-live="0">Снимок</span>
    <span id="stamp"></span>
    <span>Источник — <code style="font-family:var(--mono);font-size:12px">.orchestrator/status.json</code></span>
  </footer>
</main>

<script>
const SNAPSHOT = __DATA__;

const TSTATE = {todo:"не начат", doing:"в работе", done:"готов", failed:"упал"};
const RSTATE = {pending:"не сверено", confirmed:"сделано", partial:"частично",
                missing:"не сделано", "out-of-scope":"не делаем"};
const PLURAL = (n,a,b,c)=>{const m=n%100,k=n%10;
  return n+" "+(m>=11&&m<=14?c:k===1?a:k>=2&&k<=4?b:c);};
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function paint(payload, live){
  const d = payload.status, m = payload.metrics;

  document.getElementById("project").textContent = d.project || "Прогон";
  document.getElementById("brief").textContent = d.brief || "";
  document.title = (d.project || "Прогон") + " — son-of-orchestrator";

  // фазы
  const cur = m.phase_current;
  document.getElementById("phases").innerHTML = m.phase_names.map((name,i)=>{
    const s = typeof cur!=="number" ? "todo" : i<cur ? "done" : i===cur ? "now" : "todo";
    return `<li data-s="${s}"><div class="bar"></div><span>${esc(name)}</span></li>`;
  }).join("");

  // шкала: две дорожки на общей шкале 0–100, отметка цели справа
  const done = m.completion, hit = m.hit;
  const laneHit = document.getElementById("lane-hit");
  document.getElementById("f-done").style.setProperty("--rest", (100 - done) + "%");
  document.getElementById("v-done").textContent = done + "%";
  laneHit.dataset.void = hit == null ? "1" : "0";
  document.getElementById("f-hit").style.setProperty("--rest", (hit == null ? 0 : 100 - hit) + "%");
  document.getElementById("v-hit").textContent = hit == null ? "—" : hit + "%";

  // Основание попадания показывается всегда: голый процент умалчивает, сколько
  // требований ещё не сверено, и тем самым врёт о полноте.
  const verified = m.req_scored - m.req_pending;
  document.getElementById("basis").textContent = m.req_scored === 0 ? ""
    : hit == null
      ? `Ни одно из ${PLURAL(m.req_scored,"требования","требований","требований")} ещё не сверено с результатом`
      : `Сверено ${verified} из ${PLURAL(m.req_scored,"требования","требований","требований")}`
        + (m.req_pending ? `, ${m.req_pending} ещё нет` : "")
        + (m.req_out ? `; ${m.req_out} сознательно не делаем` : "");

  // зона разрыва внутри каждой дорожки + подпись над первой из них
  const zones = document.querySelectorAll(".gapzone");
  const tag = document.getElementById("bridge-t");
  if (hit != null && hit !== done) {
    const lo = Math.min(done, hit), hi = Math.max(done, hit);
    zones.forEach(z => { z.hidden = false; z.style.left = lo + "%"; z.style.width = (hi - lo) + "%"; });
    const lanes = document.getElementById("lanes").getBoundingClientRect();
    const r0 = document.querySelector(".rail").getBoundingClientRect();
    tag.hidden = false;
    tag.style.left = ((r0.left - lanes.left) + r0.width * (lo + hi) / 200) + "px";
    tag.textContent = PLURAL(Math.abs(done - hit), "пункт разрыва", "пункта разрыва", "пунктов разрыва");
  } else {
    zones.forEach(z => z.hidden = true);
    tag.hidden = true;
  }

  const notes = [];
  if (m.tickets_total === 0) {
    notes.push("Тикетов ещё нет — они появятся после нарезки. Пока идёт разбор задачи.");
  } else {
    notes.push(`Закрыто ${m.tickets_by_state.done} из ${PLURAL(m.tickets_total,"тикета","тикетов","тикетов")}.`);
  }
  if (hit == null) {
    notes.push("Попадание считается на финише, когда каждое требование сверено с результатом. До сверки числа нет — показывать вместо него ноль было бы враньём.");
  } else if (m.req_pending) {
    notes.push(`Число посчитано по сверенным требованиям. Пока ${m.req_pending} не сверено, оно может измениться в обе стороны.`);
  } else if (hit === done) {
    notes.push("Выполнение и попадание совпали: сделанное отвечает тому, что просили.");
  }
  if (hit != null && hit !== done) {
    notes.push(done > hit
      ? "Тикеты закрыты лучше, чем поняты: часть требований выполнена не так, как человек просил."
      : "Требования закрыты шире, чем нарезка: часть работы сделана вне тикетов.");
  }
  document.getElementById("gapnote").innerHTML = notes.join(" ");

  // тикеты
  const ts = d.tickets||[];
  document.getElementById("t-sub").textContent = ts.length
    ? `${m.checks_pass} из ${PLURAL(m.checks_total,"пункта приёмки","пунктов приёмки","пунктов приёмки")} пройдено`
    : "";
  document.getElementById("tickets").innerHTML = ts.length ? ts.map(t=>`
    <li data-s="${esc(t.state)}">
      <span class="id">${esc(t.id)}</span>
      <div class="ttl">
        <b>${esc(t.title)}</b>
        ${t.note ? `<small>${esc(t.note)}</small>` : ""}
        <div class="pips">${(t.checks||[]).map(c=>`<span class="pip" data-p="${esc(c.state)}" title="${esc(c.text)}"></span>`).join("")}</div>
      </div>
      <span class="chip" data-s="${esc(t.state)}">${TSTATE[t.state]||esc(t.state)}</span>
    </li>`).join("")
    : `<p class="empty">Нарезка ещё не сделана.</p>`;

  // требования
  const rs = d.requirements||[];
  document.getElementById("r-sub").textContent = rs.length
    ? `${m.req_scored} в работе, ${m.req_out} сознательно не делаем`
    : "";
  document.getElementById("reqs").innerHTML = rs.length ? rs.map(r=>`
    <li data-s="${esc(r.state)}">
      <span class="id">${esc(r.id)}</span>
      <blockquote>
        <b>${esc(r.text)}</b>
        ${r.note ? `<small>${esc(r.note)}</small>` : ""}
        <div class="trace">${esc(r.source||"")}${r.spec?" → "+esc(r.spec):""}${(r.tickets||[]).length?" → "+r.tickets.map(esc).join(" "):""}</div>
      </blockquote>
      <span class="chip" data-s="${esc(r.state)}">${RSTATE[r.state]||esc(r.state)}</span>
    </li>`).join("")
    : `<p class="empty">Требования выпишутся при нарезке.</p>`;

  const el = document.getElementById("live");
  el.dataset.live = live ? "1" : "0";
  el.textContent = live ? "Обновляется" : "Снимок";
  document.getElementById("stamp").textContent =
    "Данные от " + new Date(d.updated || payload.rendered).toLocaleString("ru-RU");
}

paint(SNAPSHOT, false);

// Живое обновление возможно только под сервером: на file:// запрос к соседнему
// файлу блокируется правилом одного источника. Без сервера страница остаётся
// честным снимком и об этом прямо написано в подвале.
if (location.protocol.startsWith("http")){
  const METRICS = SNAPSHOT.metrics;
  let last = JSON.stringify(SNAPSHOT.status);
  setInterval(async ()=>{
    try{
      const r = await fetch("status.json", {cache:"no-store"});
      if(!r.ok) return;
      const status = await r.json();
      const raw = JSON.stringify(status);
      if (raw === last) return;
      last = raw;
      const res = await fetch("metrics.json", {cache:"no-store"}).catch(()=>null);
      paint({status, metrics: res && res.ok ? await res.json() : recompute(status, METRICS), rendered:new Date().toISOString()}, true);
    }catch(e){ /* сервер погашен — остаёмся на последнем снимке */ }
  }, 2000);
  document.getElementById("live").dataset.live = "1";
  document.getElementById("live").textContent = "Обновляется";
}

// Пересчёт на стороне страницы, чтобы не требовать перезапуска скрипта.
function recompute(d, base){
  const ts = d.tickets||[], rs = d.requirements||[];
  const by = {todo:0,doing:0,done:0,failed:0};
  ts.forEach(t=>{ if(t.state in by) by[t.state]++; });
  const scored = rs.filter(r=>r.state!=="out-of-scope");
  const pending = scored.filter(r=>r.state==="pending").length;
  const confirmed = scored.filter(r=>r.state==="confirmed").length;
  const checks = ts.flatMap(t=>t.checks||[]);
  const ph = d.phase||{};
  return {
    phase_current: ph.current, phase_name: ph.name, phase_names: base.phase_names,
    tickets_total: ts.length, tickets_by_state: by,
    completion: ts.length ? Math.round(by.done/ts.length*100) : 0,
    req_total: rs.length, req_scored: scored.length, req_confirmed: confirmed,
    req_partial: scored.filter(r=>r.state==="partial").length,
    req_missing: scored.filter(r=>r.state==="missing").length,
    req_pending: pending, req_out: rs.length-scored.length,
    hit: (scored.length-pending)>0 ? Math.round(confirmed/(scored.length-pending)*100) : null,
    checks_total: checks.length, checks_pass: checks.filter(c=>c.state==="pass").length,
  };
}
</script>
</body>
</html>
